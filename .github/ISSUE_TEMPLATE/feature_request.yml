name: Feature request
description: Propose a decision-centered, evidence-bounded improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision or user task
      description: What question should the feature help answer?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and failure boundary
      description: Which data and validation would support it, and when should it refuse?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require sharing private health data.
          required: true
